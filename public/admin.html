<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title data-i18n="title.admin">LAMPUS — ความคิดเห็น</title>
  <meta name="theme-color" content="#070b14">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/firefly.css">
</head>
<body>
  <main class="owner admin">
    <div class="owner-top">
      <a href="/" data-i18n="a.back">← แผนที่</a>
      <button class="install-link" type="button" data-lang-toggle data-i18n="lang.switch" data-i18n-label="lang.switchLabel">EN</button>
    </div>
    <h1 data-i18n="a.title">📬 ความคิดเห็นจากผู้ใช้</h1>

    <form class="card" id="login">
      <label for="key" data-i18n="a.key">รหัสผู้ดูแล (ADMIN_KEY)</label>
      <input id="key" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit" data-i18n="a.login">เข้าดู</button>
      <div class="msg" id="login-msg"></div>
    </form>

    <section id="inbox" class="hidden">
      <div class="fb-filter admin-tabs">
        <button type="button" data-view="feedback" aria-pressed="true" data-i18n="a.tabFeedback">💬 ความคิดเห็น</button>
        <button type="button" data-view="shops" aria-pressed="false" data-i18n="a.tabShops">🚚 ร้านทั้งหมด</button>
        <button type="button" id="backup" data-i18n="a.backup">⬇ ดาวน์โหลดข้อมูลสำรอง</button>
      </div>
      <div id="view-shops" class="hidden"><div id="shops"></div></div>
      <div id="view-feedback">
      <div class="fb-filter">
        <button type="button" data-filter="new" aria-pressed="true"><span data-i18n="a.unread">ยังไม่อ่าน</span> <b id="count-new">0</b></button>
        <button type="button" data-filter="all" aria-pressed="false"><span data-i18n="a.all">ทั้งหมด</span> <b id="count-all">0</b></button>
        <button type="button" id="refresh">↻</button>
        <button type="button" id="logout" data-i18n="a.logout">ออก</button>
      </div>
      <div id="list"></div>
      </div>
    </section>
  </main>
  <script src="/i18n.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
