<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>LAMPUS — ความคิดเห็น</title>
  <meta name="theme-color" content="#070b14">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/firefly.css">
</head>
<body>
  <main class="owner admin">
    <a href="/">← แผนที่</a>
    <h1>📬 ความคิดเห็นจากผู้ใช้</h1>

    <form class="card" id="login">
      <label for="key">รหัสผู้ดูแล (ADMIN_KEY)</label>
      <input id="key" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">เข้าดู</button>
      <div class="msg" id="login-msg"></div>
    </form>

    <section id="inbox" class="hidden">
      <div class="fb-filter">
        <button type="button" data-filter="new" aria-pressed="true">ยังไม่อ่าน <b id="count-new">0</b></button>
        <button type="button" data-filter="all" aria-pressed="false">ทั้งหมด <b id="count-all">0</b></button>
        <button type="button" id="refresh">↻</button>
        <button type="button" id="logout">ออก</button>
      </div>
      <div id="list"></div>
    </section>
  </main>
  <script src="/admin.js"></script>
</body>
</html>
