<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mylampus — หิ่งห้อยฟู้ดทรัค</title>
  <meta name="theme-color" content="#070b14">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mylampus">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/firefly.css">
</head>
<body>
  <div id="map"></div>

  <div class="topbar">
    <div class="brand"><span>✦</span> LAMPUS</div>
    <div class="actions">
      <button class="btn-round hidden" id="install" title="ติดตั้งแอป" aria-label="ติดตั้งแอป">⤓</button>
      <button class="btn-round" data-feedback title="ส่งความคิดเห็นถึงผู้สร้าง" aria-label="ส่งความคิดเห็นถึงผู้สร้าง">💬</button>
      <button class="btn-round" id="locate" title="ตำแหน่งของฉัน" aria-label="ตำแหน่งของฉัน">◎</button>
      <a class="btn-round" href="/owner" title="สำหรับเจ้าของร้าน" aria-label="สำหรับเจ้าของร้าน">🚚</a>
    </div>
  </div>

  <aside class="sheet" id="sheet" aria-hidden="true" aria-label="ข้อมูลร้าน"></aside>

  <div class="install-tip hidden" id="install-tip" role="dialog" aria-label="วิธีติดตั้งแอป">
    <b>ติดตั้ง Mylampus บน iPhone</b>
    <ol>
      <li>เปิดหน้านี้ใน <b>Safari</b></li>
      <li>กดปุ่ม <b>แชร์</b> (สี่เหลี่ยมมีลูกศรชี้ขึ้น)</li>
      <li>เลือก <b>เพิ่มไปยังหน้าจอโฮม</b></li>
    </ol>
    <small>แตะเพื่อปิด</small>
  </div>

  <div class="counter" id="counter">กำลังมองหาหิ่งห้อย…</div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/map.js"></script>
  <script src="/pwa.js"></script>
  <script src="/feedback.js"></script>
</body>
</html>
