<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#070b14">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LAMPUS">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">

<body>
  <div id="map"></div>

  <div class="topbar">
    <div class="brand"><span>✦</span> LAMPUS <button class="lang-chip" data-lang-toggle data-i18n="lang.switch" data-i18n-label="lang.switchLabel">EN</button></div>
    <div class="actions">
      <button class="btn-round hidden" id="install" data-i18n-label="map.install">⤓</button>
      <button class="btn-round" data-feedback data-i18n-label="map.feedback">💬</button>
      <button class="btn-round" id="locate" data-i18n-label="map.locate">◎</button>
      <a class="btn-round" href="/owner" data-i18n-label="map.owner">🚚</a>
    </div>
  </div>

  <aside class="sheet" id="sheet" aria-hidden="true" data-i18n-label="map.sheet"></aside>

  <div class="install-tip hidden" id="install-tip" role="dialog" data-i18n-label="install.tipLabel" data-i18n-html="install.tip"></div>

  <div class="counter" id="counter" data-i18n="map.searching">กำลังมองหาหิ่งห้อย…</div>

  <script src="/i18n.js"></script>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/map.js"></script>
